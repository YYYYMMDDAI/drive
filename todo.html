<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TODOリスト管理ツール</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #f5f6fa;
        color: #1f1f1f;
      }
      .container {
        max-width: 720px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin-top: 0;
        font-size: 1.8rem;
      }
      form {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
      }
      input[type="text"] {
        flex: 1;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid #d6d6d6;
        font-size: 1rem;
      }
      button {
        padding: 12px 18px;
        border-radius: 12px;
        border: none;
        background: #2563eb;
        color: #ffffff;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: #e5e7eb;
        color: #111827;
      }
      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .controls button.active {
        background: #111827;
        color: #ffffff;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 12px;
      }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid #e5e7eb;
      }
      .task-title {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
      }
      .task-title span.done {
        text-decoration: line-through;
        color: #9ca3af;
      }
      .task-actions {
        display: flex;
        gap: 8px;
      }
      .task-actions button {
        padding: 8px 12px;
        font-size: 0.9rem;
      }
      .empty {
        color: #6b7280;
        text-align: center;
        padding: 16px 0;
      }
      .footer {
        margin-top: 24px;
        font-size: 0.85rem;
        color: #6b7280;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
          color: #e2e8f0;
        }
        .container {
          background: #111827;
          box-shadow: none;
        }
        input[type="text"] {
          background: #0f172a;
          border-color: #1f2937;
          color: #e2e8f0;
        }
        li {
          border-color: #1f2937;
        }
        button.secondary {
          background: #1f2937;
          color: #e2e8f0;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>TODOリスト管理ツール</h1>
      <form id="task-form">
        <input
          id="task-input"
          type="text"
          placeholder="新しいタスクを入力"
          autocomplete="off"
          required
        />
        <button type="submit">追加</button>
      </form>

      <div class="controls">
        <button type="button" data-filter="all" class="secondary active">すべて</button>
        <button type="button" data-filter="todo" class="secondary">未完了</button>
        <button type="button" data-filter="done" class="secondary">完了</button>
        <button type="button" id="clear-done" class="secondary">完了を削除</button>
        <button type="button" id="clear-all" class="secondary">すべて削除</button>
      </div>

      <ul id="task-list"></ul>
      <p id="empty-state" class="empty" hidden>タスクはありません。</p>

      <p class="footer">データはこの端末のブラウザ内(LocalStorage)に保存されます。</p>
    </div>

    <script>
      const STORAGE_KEY = "todo_tasks_v1";
      const taskForm = document.getElementById("task-form");
      const taskInput = document.getElementById("task-input");
      const taskList = document.getElementById("task-list");
      const emptyState = document.getElementById("empty-state");
      const filterButtons = document.querySelectorAll("[data-filter]");
      const clearDoneButton = document.getElementById("clear-done");
      const clearAllButton = document.getElementById("clear-all");

      let tasks = loadTasks();
      let currentFilter = "all";

      function loadTasks() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        try {
          return JSON.parse(raw);
        } catch (error) {
          return [];
        }
      }

      function saveTasks() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      function addTask(title) {
        tasks.unshift({
          id: crypto.randomUUID(),
          title,
          done: false,
          createdAt: new Date().toISOString(),
        });
        saveTasks();
        render();
      }

      function toggleTask(id) {
        tasks = tasks.map((task) =>
          task.id === id ? { ...task, done: !task.done } : task
        );
        saveTasks();
        render();
      }

      function deleteTask(id) {
        tasks = tasks.filter((task) => task.id !== id);
        saveTasks();
        render();
      }

      function clearDone() {
        tasks = tasks.filter((task) => !task.done);
        saveTasks();
        render();
      }

      function clearAll() {
        tasks = [];
        saveTasks();
        render();
      }

      function setFilter(filter) {
        currentFilter = filter;
        filterButtons.forEach((button) => {
          button.classList.toggle("active", button.dataset.filter === filter);
        });
        render();
      }

      function filteredTasks() {
        if (currentFilter === "done") {
          return tasks.filter((task) => task.done);
        }
        if (currentFilter === "todo") {
          return tasks.filter((task) => !task.done);
        }
        return tasks;
      }

      function render() {
        const visibleTasks = filteredTasks();
        taskList.innerHTML = "";

        if (visibleTasks.length === 0) {
          emptyState.hidden = false;
          return;
        }

        emptyState.hidden = true;

        visibleTasks.forEach((task) => {
          const listItem = document.createElement("li");
          const titleWrapper = document.createElement("div");
          titleWrapper.className = "task-title";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = task.done;
          checkbox.addEventListener("change", () => toggleTask(task.id));

          const title = document.createElement("span");
          title.textContent = task.title;
          if (task.done) {
            title.classList.add("done");
          }

          titleWrapper.append(checkbox, title);

          const actions = document.createElement("div");
          actions.className = "task-actions";

          const deleteButton = document.createElement("button");
          deleteButton.className = "secondary";
          deleteButton.type = "button";
          deleteButton.textContent = "削除";
          deleteButton.addEventListener("click", () => deleteTask(task.id));

          actions.appendChild(deleteButton);
          listItem.append(titleWrapper, actions);
          taskList.appendChild(listItem);
        });
      }

      taskForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const title = taskInput.value.trim();
        if (!title) return;
        addTask(title);
        taskInput.value = "";
      });

      filterButtons.forEach((button) => {
        button.addEventListener("click", () => setFilter(button.dataset.filter));
      });

      clearDoneButton.addEventListener("click", () => {
        if (confirm("完了したタスクを削除しますか？")) {
          clearDone();
        }
      });

      clearAllButton.addEventListener("click", () => {
        if (confirm("すべてのタスクを削除しますか？")) {
          clearAll();
        }
      });

      render();
    </script>
  </body>
</html>

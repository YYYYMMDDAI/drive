<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TODOリスト管理ツール</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 32px 20px 48px;
        background: radial-gradient(circle at top, #eef2ff, #f8fafc 55%, #ffffff);
        color: #0f172a;
      }
      .app {
        max-width: 820px;
        margin: 0 auto;
      }
      .app-header {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }
      h1 {
        margin: 0;
        font-size: 2rem;
        letter-spacing: 0.02em;
      }
      .subtitle {
        margin: 6px 0 0;
        color: #475569;
        font-size: 0.95rem;
      }
      .card {
        background: #ffffff;
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        border: 1px solid rgba(148, 163, 184, 0.2);
      }
      .input-card {
        margin-bottom: 16px;
      }
      form {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
      }
      input[type="text"] {
        flex: 1;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid #cbd5f5;
        background: #f8fafc;
        font-size: 1rem;
      }
      button {
        padding: 12px 18px;
        border-radius: 14px;
        border: none;
        background: #2563eb;
        color: #ffffff;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }
      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(37, 99, 235, 0.2);
      }
      button.secondary,
      button.chip {
        background: #e2e8f0;
        color: #0f172a;
      }
      button.danger {
        background: #ef4444;
        color: #fff;
      }
      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .controls button.chip {
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 0.9rem;
      }
      .controls button.active {
        background: #1e293b;
        color: #ffffff;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 12px;
      }
      .stat {
        padding: 12px 14px;
        border-radius: 14px;
        background: #f8fafc;
        border: 1px solid rgba(148, 163, 184, 0.3);
      }
      .stat-label {
        font-size: 0.8rem;
        color: #64748b;
        display: block;
      }
      .stat-value {
        font-size: 1.3rem;
        font-weight: 700;
        color: #0f172a;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 12px;
      }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        background: #ffffff;
      }
      .task-title {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
      }
      .task-title span.done {
        text-decoration: line-through;
        color: #9ca3af;
      }
      .task-actions {
        display: flex;
        gap: 8px;
      }
      .task-actions button {
        padding: 8px 12px;
        font-size: 0.9rem;
      }
      .empty {
        color: #6b7280;
        text-align: center;
        padding: 24px 0 12px;
      }
      .footer {
        margin-top: 24px;
        font-size: 0.85rem;
        color: #6b7280;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: radial-gradient(circle at top, #0f172a, #020617 70%);
          color: #e2e8f0;
        }
        .card {
          background: #0f172a;
          box-shadow: none;
          border-color: #1f2937;
        }
        input[type="text"] {
          background: #0b1220;
          border-color: #1f2937;
          color: #e2e8f0;
        }
        li {
          border-color: #1f2937;
          background: #0b1220;
        }
        button.secondary,
        button.chip {
          background: #1f2937;
          color: #e2e8f0;
        }
        .stat {
          background: #0b1220;
          border-color: #1f2937;
        }
        .stat-value {
          color: #e2e8f0;
        }
        .subtitle,
        .footer,
        .stat-label,
        .empty {
          color: #94a3b8;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div>
          <h1>TODOリスト</h1>
          <p class="subtitle">iPhone/iPad/PCでそのまま使えるローカルTODO</p>
        </div>
        <div class="controls">
          <button type="button" id="clear-done" class="secondary">完了を削除</button>
          <button type="button" id="clear-all" class="danger">すべて削除</button>
        </div>
      </header>

      <section class="card input-card">
        <form id="task-form">
          <input
            id="task-input"
            type="text"
            placeholder="新しいタスクを入力"
            autocomplete="off"
            required
          />
          <button type="submit">追加</button>
        </form>
        <div class="stats">
          <div class="stat">
            <span class="stat-label">全タスク</span>
            <span class="stat-value" id="count-all">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">未完了</span>
            <span class="stat-value" id="count-todo">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">完了</span>
            <span class="stat-value" id="count-done">0</span>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="controls">
          <button type="button" data-filter="all" class="chip active">すべて</button>
          <button type="button" data-filter="todo" class="chip">未完了</button>
          <button type="button" data-filter="done" class="chip">完了</button>
        </div>

        <ul id="task-list"></ul>
        <p id="empty-state" class="empty" hidden>タスクはありません。</p>
      </section>

      <p class="footer">
        データはこの端末のブラウザ内(LocalStorage)に保存されます。PCでの検証時も
        todo.html をそのまま開くだけで利用できます。
      </p>
    </div>

    <script>
      const STORAGE_KEY = "todo_tasks_v1";
      const taskForm = document.getElementById("task-form");
      const taskInput = document.getElementById("task-input");
      const taskList = document.getElementById("task-list");
      const emptyState = document.getElementById("empty-state");
      const filterButtons = document.querySelectorAll("[data-filter]");
      const clearDoneButton = document.getElementById("clear-done");
      const clearAllButton = document.getElementById("clear-all");
      const countAll = document.getElementById("count-all");
      const countTodo = document.getElementById("count-todo");
      const countDone = document.getElementById("count-done");

      let tasks = loadTasks();
      let currentFilter = "all";

      function loadTasks() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        try {
          return JSON.parse(raw);
        } catch (error) {
          return [];
        }
      }

      function saveTasks() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      function addTask(title) {
        tasks.unshift({
          id: crypto.randomUUID(),
          title,
          done: false,
          createdAt: new Date().toISOString(),
        });
        saveTasks();
        render();
      }

      function toggleTask(id) {
        tasks = tasks.map((task) =>
          task.id === id ? { ...task, done: !task.done } : task
        );
        saveTasks();
        render();
      }

      function deleteTask(id) {
        tasks = tasks.filter((task) => task.id !== id);
        saveTasks();
        render();
      }

      function clearDone() {
        tasks = tasks.filter((task) => !task.done);
        saveTasks();
        render();
      }

      function clearAll() {
        tasks = [];
        saveTasks();
        render();
      }

      function setFilter(filter) {
        currentFilter = filter;
        filterButtons.forEach((button) => {
          button.classList.toggle("active", button.dataset.filter === filter);
        });
        render();
      }

      function filteredTasks() {
        if (currentFilter === "done") {
          return tasks.filter((task) => task.done);
        }
        if (currentFilter === "todo") {
          return tasks.filter((task) => !task.done);
        }
        return tasks;
      }

      function render() {
        const visibleTasks = filteredTasks();
        taskList.innerHTML = "";

        const doneCount = tasks.filter((task) => task.done).length;
        countAll.textContent = tasks.length.toString();
        countTodo.textContent = (tasks.length - doneCount).toString();
        countDone.textContent = doneCount.toString();

        emptyState.hidden = visibleTasks.length !== 0;

        if (visibleTasks.length === 0) {
          return;
        }

        visibleTasks.forEach((task) => {
          const listItem = document.createElement("li");
          const titleWrapper = document.createElement("div");
          titleWrapper.className = "task-title";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = task.done;
          checkbox.addEventListener("change", () => toggleTask(task.id));

          const title = document.createElement("span");
          title.textContent = task.title;
          if (task.done) {
            title.classList.add("done");
          }

          titleWrapper.append(checkbox, title);

          const actions = document.createElement("div");
          actions.className = "task-actions";

          const deleteButton = document.createElement("button");
          deleteButton.className = "secondary";
          deleteButton.type = "button";
          deleteButton.textContent = "削除";
          deleteButton.addEventListener("click", () => deleteTask(task.id));

          actions.appendChild(deleteButton);
          listItem.append(titleWrapper, actions);
          taskList.appendChild(listItem);
        });
      }

      taskForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const title = taskInput.value.trim();
        if (!title) return;
        addTask(title);
        taskInput.value = "";
      });

      filterButtons.forEach((button) => {
        button.addEventListener("click", () => setFilter(button.dataset.filter));
      });

      clearDoneButton.addEventListener("click", () => {
        if (confirm("完了したタスクを削除しますか？")) {
          clearDone();
        }
      });

      clearAllButton.addEventListener("click", () => {
        if (confirm("すべてのタスクを削除しますか？")) {
          clearAll();
        }
      });

      render();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Input — 音声入力 & 翻訳</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Voice Input</h1>
      <p class="subtitle">音声入力 & 多言語翻訳</p>
    </header>

    <main>
      <!-- 入力言語選択 -->
      <div class="control-row">
        <label for="input-lang">入力言語</label>
        <select id="input-lang">
          <option value="ja-JP" selected>日本語</option>
          <option value="en-US">English</option>
          <option value="zh-CN">中文（普通话）</option>
          <option value="ko-KR">한국어</option>
          <option value="es-ES">Español</option>
          <option value="fr-FR">Français</option>
        </select>
      </div>

      <!-- 認識結果エリア -->
      <section class="result-section">
        <div class="section-header">
          <h2>認識結果</h2>
          <button class="copy-btn" id="copy-recognition" title="コピー">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span>コピー</span>
          </button>
        </div>
        <div class="text-area" id="recognition-output">
          <span class="placeholder">ここに認識結果が表示されます...</span>
        </div>
      </section>

      <!-- 録音ボタン -->
      <div class="mic-container">
        <button class="mic-btn" id="mic-btn" aria-label="録音開始">
          <svg class="mic-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
          <svg class="stop-icon hidden" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <span class="mic-label" id="mic-label">タップして録音開始</span>
      </div>

      <!-- 翻訳セクション -->
      <section class="result-section translation-section">
        <div class="section-header">
          <h2>翻訳</h2>
          <button class="copy-btn" id="copy-translation" title="コピー">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span>コピー</span>
          </button>
        </div>
        <div class="control-row">
          <label for="output-lang">翻訳先</label>
          <select id="output-lang">
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="zh">中文</option>
            <option value="ko">한국어</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="pt">Português</option>
            <option value="it">Italiano</option>
            <option value="ru">Русский</option>
          </select>
        </div>
        <div class="text-area" id="translation-output">
          <span class="placeholder">翻訳結果がここに表示されます...</span>
        </div>
      </section>
    </main>

    <!-- ブラウザ非対応通知 -->
    <div class="unsupported-banner hidden" id="unsupported-banner">
      このブラウザはWeb Speech APIに対応していません。Chrome または Edge をお使いください。
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

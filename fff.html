<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFF - Faint Fog Fantasy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #16161d;
            --text-primary: #e8e8ed;
            --text-secondary: #8888aa;
            --accent: #6b5b95;
            --accent-hover: #8b7bb5;
            --fog-color: rgba(200, 200, 220, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #1a1a25 0%, #0d0d12 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 8px;
            color: var(--text-primary);
        }

        .logo span {
            opacity: 0.5;
        }

        .tagline {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 5px;
            letter-spacing: 2px;
        }

        /* Upload Section */
        .upload-section {
            padding: 30px 20px;
            text-align: center;
        }

        .upload-area {
            border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 40px 20px;
            margin: 0 auto;
            max-width: 400px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.02);
        }

        .upload-area:hover {
            border-color: var(--accent);
            background: rgba(107, 91, 149, 0.1);
        }

        .upload-area.dragover {
            border-color: var(--accent);
            background: rgba(107, 91, 149, 0.2);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.6;
        }

        .upload-text {
            color: var(--text-secondary);
            font-size: 14px;
        }

        #fileInput {
            display: none;
        }

        /* Editor Section */
        .editor-section {
            display: none;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .editor-section.active {
            display: block;
        }

        .preview-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            margin-bottom: 20px;
        }

        #previewCanvas {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Fog Overlay */
        .fog-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 0%, var(--fog-color) 100%);
            opacity: 0.8;
            transition: opacity 2s ease;
        }

        .fog-overlay.revealed {
            opacity: 0;
        }

        /* Controls */
        .controls {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .control-value {
            color: var(--text-primary);
            font-weight: 500;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.1);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            transition: transform 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Style Buttons */
        .style-buttons {
            display: flex;
            gap: 10px;
        }

        .style-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .style-btn.active {
            border-color: var(--accent);
            background: rgba(107, 91, 149, 0.2);
            color: var(--text-primary);
        }

        .style-btn:hover {
            border-color: var(--accent-hover);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
        }

        /* Gallery Section */
        .gallery-section {
            padding: 20px;
        }

        .section-title {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
        }

        .gallery-item {
            aspect-ratio: 1;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            background: var(--bg-card);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .gallery-item .fog-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, transparent 30%, var(--fog-color) 100%);
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .gallery-item:hover .fog-layer {
            opacity: 0.3;
        }

        .gallery-item .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            font-size: 14px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .gallery-item:hover .delete-btn {
            opacity: 1;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            max-width: 100%;
            max-height: 90vh;
            position: relative;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 8px;
        }

        .modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: none;
            border: none;
            color: white;
            font-size: 30px;
            cursor: pointer;
        }

        /* Animations */
        @keyframes fogFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.02); }
        }

        .fog-animate {
            animation: fogFloat 8s ease-in-out infinite;
        }

        /* Responsive */
        @media (min-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 4px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">F<span>F</span>F</div>
        <div class="tagline">Faint Fog Fantasy</div>
    </header>

    <!-- Upload Section -->
    <section class="upload-section" id="uploadSection">
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">🌫️</div>
            <div class="upload-text">タップして画像を選択<br>またはドラッグ&ドロップ</div>
        </div>
        <input type="file" id="fileInput" accept="image/*">
    </section>

    <!-- Editor Section -->
    <section class="editor-section" id="editorSection">
        <div class="preview-container">
            <canvas id="previewCanvas"></canvas>
            <div class="fog-overlay fog-animate" id="fogOverlay"></div>
        </div>

        <div class="controls">
            <div class="control-group">
                <div class="control-label">
                    <span>スタイル</span>
                </div>
                <div class="style-buttons">
                    <button class="style-btn active" data-style="polygon">ポリゴン</button>
                    <button class="style-btn" data-style="dot">ドット</button>
                    <button class="style-btn" data-style="lowpoly">ローポリ</button>
                </div>
            </div>

            <div class="control-group">
                <div class="control-label">
                    <span>解像度</span>
                    <span class="control-value" id="resolutionValue">中</span>
                </div>
                <input type="range" id="resolutionSlider" min="1" max="5" value="3">
            </div>

            <div class="control-group">
                <div class="control-label">
                    <span>霧の濃さ</span>
                    <span class="control-value" id="fogValue">50%</span>
                </div>
                <input type="range" id="fogSlider" min="0" max="100" value="50">
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-secondary" id="cancelBtn">キャンセル</button>
            <button class="btn btn-primary" id="postBtn">投稿する</button>
        </div>
    </section>

    <!-- Gallery Section -->
    <section class="gallery-section" id="gallerySection">
        <div class="section-title">GALLERY</div>
        <div class="gallery-grid" id="galleryGrid">
            <!-- Posts will be inserted here -->
        </div>
        <div class="empty-state" id="emptyState">
            <div class="empty-state-icon">🌫️</div>
            <p>まだ投稿がありません<br>霧の向こうへ、最初の一歩を</p>
        </div>
    </section>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <img id="modalImage" src="" alt="">
        </div>
    </div>

    <script>
        // State
        let currentStyle = 'polygon';
        let currentResolution = 3;
        let currentFog = 50;
        let originalImage = null;
        let posts = JSON.parse(localStorage.getItem('fff_posts') || '[]');

        // Elements
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadSection = document.getElementById('uploadSection');
        const editorSection = document.getElementById('editorSection');
        const gallerySection = document.getElementById('gallerySection');
        const previewCanvas = document.getElementById('previewCanvas');
        const ctx = previewCanvas.getContext('2d');
        const fogOverlay = document.getElementById('fogOverlay');
        const galleryGrid = document.getElementById('galleryGrid');
        const emptyState = document.getElementById('emptyState');
        const modal = document.getElementById('modal');
        const modalImage = document.getElementById('modalImage');

        // Event Listeners
        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                loadImage(file);
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                loadImage(file);
            }
        });

        // Style buttons
        document.querySelectorAll('.style-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentStyle = btn.dataset.style;
                applyEffect();
            });
        });

        // Resolution slider
        document.getElementById('resolutionSlider').addEventListener('input', (e) => {
            currentResolution = parseInt(e.target.value);
            const labels = ['極低', '低', '中', '高', '極高'];
            document.getElementById('resolutionValue').textContent = labels[currentResolution - 1];
            applyEffect();
        });

        // Fog slider
        document.getElementById('fogSlider').addEventListener('input', (e) => {
            currentFog = parseInt(e.target.value);
            document.getElementById('fogValue').textContent = currentFog + '%';
            fogOverlay.style.opacity = currentFog / 100 * 0.8;
        });

        // Cancel button
        document.getElementById('cancelBtn').addEventListener('click', () => {
            editorSection.classList.remove('active');
            uploadSection.style.display = 'block';
            fileInput.value = '';
        });

        // Post button
        document.getElementById('postBtn').addEventListener('click', () => {
            const imageData = previewCanvas.toDataURL('image/jpeg', 0.8);
            const post = {
                id: Date.now(),
                image: imageData,
                style: currentStyle,
                fog: currentFog,
                createdAt: new Date().toISOString()
            };
            posts.unshift(post);
            savePosts();
            renderGallery();

            editorSection.classList.remove('active');
            uploadSection.style.display = 'block';
            fileInput.value = '';
        });

        // Modal
        document.getElementById('modalClose').addEventListener('click', () => {
            modal.classList.remove('active');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        });

        // Functions
        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    uploadSection.style.display = 'none';
                    editorSection.classList.add('active');
                    applyEffect();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function applyEffect() {
            if (!originalImage) return;

            const maxSize = 800;
            let width = originalImage.width;
            let height = originalImage.height;

            if (width > maxSize || height > maxSize) {
                const ratio = Math.min(maxSize / width, maxSize / height);
                width *= ratio;
                height *= ratio;
            }

            previewCanvas.width = width;
            previewCanvas.height = height;

            switch (currentStyle) {
                case 'polygon':
                    applyPolygonEffect(width, height);
                    break;
                case 'dot':
                    applyDotEffect(width, height);
                    break;
                case 'lowpoly':
                    applyLowPolyEffect(width, height);
                    break;
            }
        }

        function applyPolygonEffect(width, height) {
            // Draw original
            ctx.drawImage(originalImage, 0, 0, width, height);
            const imageData = ctx.getImageData(0, 0, width, height);

            // Clear and redraw with polygon effect
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, width, height);

            const cellSize = Math.max(5, 30 - currentResolution * 5);

            for (let y = 0; y < height; y += cellSize) {
                for (let x = 0; x < width; x += cellSize) {
                    const px = Math.min(x + cellSize / 2, width - 1);
                    const py = Math.min(y + cellSize / 2, height - 1);
                    const i = (Math.floor(py) * width + Math.floor(px)) * 4;

                    const r = imageData.data[i];
                    const g = imageData.data[i + 1];
                    const b = imageData.data[i + 2];

                    ctx.fillStyle = `rgb(${r},${g},${b})`;

                    // Draw triangular polygons
                    ctx.beginPath();
                    const offset = (Math.floor(y / cellSize) % 2) * (cellSize / 2);
                    ctx.moveTo(x + offset, y);
                    ctx.lineTo(x + cellSize + offset, y);
                    ctx.lineTo(x + cellSize / 2 + offset, y + cellSize);
                    ctx.closePath();
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(x + offset, y);
                    ctx.lineTo(x + cellSize / 2 + offset, y + cellSize);
                    ctx.lineTo(x - cellSize / 2 + offset, y + cellSize);
                    ctx.closePath();
                    ctx.fill();
                }
            }
        }

        function applyDotEffect(width, height) {
            ctx.drawImage(originalImage, 0, 0, width, height);
            const imageData = ctx.getImageData(0, 0, width, height);

            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, width, height);

            const dotSize = Math.max(3, 20 - currentResolution * 3);
            const gap = dotSize * 1.2;

            for (let y = gap; y < height; y += gap) {
                for (let x = gap; x < width; x += gap) {
                    const i = (Math.floor(y) * width + Math.floor(x)) * 4;
                    const r = imageData.data[i];
                    const g = imageData.data[i + 1];
                    const b = imageData.data[i + 2];

                    // Brightness affects dot size
                    const brightness = (r + g + b) / 3 / 255;
                    const radius = dotSize * 0.5 * (0.3 + brightness * 0.7);

                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function applyLowPolyEffect(width, height) {
            ctx.drawImage(originalImage, 0, 0, width, height);
            const imageData = ctx.getImageData(0, 0, width, height);

            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, width, height);

            const cellSize = Math.max(8, 40 - currentResolution * 6);

            // Create grid points with some randomness
            const points = [];
            for (let y = 0; y <= height + cellSize; y += cellSize) {
                for (let x = 0; x <= width + cellSize; x += cellSize) {
                    const jitter = cellSize * 0.3;
                    points.push({
                        x: x + (Math.random() - 0.5) * jitter,
                        y: y + (Math.random() - 0.5) * jitter
                    });
                }
            }

            // Draw triangles
            const cols = Math.ceil(width / cellSize) + 2;
            for (let i = 0; i < points.length - cols - 1; i++) {
                if ((i + 1) % cols === 0) continue;

                const p1 = points[i];
                const p2 = points[i + 1];
                const p3 = points[i + cols];
                const p4 = points[i + cols + 1];

                // Triangle 1
                drawTriangle(p1, p2, p3, width, height, imageData);
                // Triangle 2
                drawTriangle(p2, p4, p3, width, height, imageData);
            }
        }

        function drawTriangle(p1, p2, p3, width, height, imageData) {
            const cx = (p1.x + p2.x + p3.x) / 3;
            const cy = (p1.y + p2.y + p3.y) / 3;

            const px = Math.max(0, Math.min(width - 1, Math.floor(cx)));
            const py = Math.max(0, Math.min(height - 1, Math.floor(cy)));
            const i = (py * width + px) * 4;

            const r = imageData.data[i];
            const g = imageData.data[i + 1];
            const b = imageData.data[i + 2];

            ctx.fillStyle = `rgb(${r},${g},${b})`;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.closePath();
            ctx.fill();
        }

        function savePosts() {
            // Keep only last 50 posts to manage storage
            posts = posts.slice(0, 50);
            localStorage.setItem('fff_posts', JSON.stringify(posts));
        }

        function renderGallery() {
            galleryGrid.innerHTML = '';

            if (posts.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            posts.forEach(post => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML = `
                    <img src="${post.image}" alt="Post">
                    <div class="fog-layer"></div>
                    <button class="delete-btn" data-id="${post.id}">&times;</button>
                `;

                item.querySelector('img').addEventListener('click', () => {
                    modalImage.src = post.image;
                    modal.classList.add('active');
                });

                item.querySelector('.delete-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    deletePost(post.id);
                });

                galleryGrid.appendChild(item);
            });
        }

        function deletePost(id) {
            posts = posts.filter(p => p.id !== id);
            savePosts();
            renderGallery();
        }

        // Initialize
        renderGallery();
    </script>
</body>
</html>

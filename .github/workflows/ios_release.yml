name: iOS Release Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IOS_PROJECT_PATH: ios/SplitEase.xcodeproj
  IOS_SCHEME: SplitEase
  EXPORT_OPTIONS_PLIST: ios/ExportOptions.plist
  IPA_OUTPUT_DIR: build/ios

jobs:
  build_ios:
    name: Build iOS (archive + ipa)
    runs-on: macos-latest
    outputs:
      ipa_path: ${{ steps.build.outputs.ipa_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate iOS project exists
        id: validate
        run: |
          if [ ! -f "${IOS_PROJECT_PATH}" ]; then
            echo "iOS project not found at ${IOS_PROJECT_PATH}."
            echo "Create Xcode project first (local Mac), then rerun this workflow."
            echo "has_ios_project=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_ios_project=true" >> "$GITHUB_OUTPUT"

      - name: Import signing assets
        if: steps.validate.outputs.has_ios_project == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERT_PATH=$RUNNER_TEMP/distribution.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo -n "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Build archive and export ipa
        if: steps.validate.outputs.has_ios_project == 'true'
        id: build
        run: |
          ARCHIVE_PATH="$RUNNER_TEMP/SplitEase.xcarchive"
          mkdir -p "$IPA_OUTPUT_DIR"

          xcodebuild \
            -project "$IOS_PROJECT_PATH" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            archive

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST" \
            -exportPath "$IPA_OUTPUT_DIR"

          IPA_PATH=$(find "$IPA_OUTPUT_DIR" -name '*.ipa' -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "ipa file not found"
            exit 1
          fi

          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        if: steps.validate.outputs.has_ios_project == 'true' && steps.build.outputs.ipa_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: SplitEase-ipa
          path: ${{ steps.build.outputs.ipa_path }}

  upload_to_app_store:
    name: Upload to App Store Connect
    runs-on: macos-latest
    needs: build_ios
    if: needs.build_ios.outputs.ipa_path != ''
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: SplitEase-ipa
          path: build/ios

      - name: Upload IPA via altool
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          IPA_PATH=$(find build/ios -name '*.ipa' -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "ipa file not found for upload"
            exit 1
          fi

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --username "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

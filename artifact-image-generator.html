<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AIを活用したブログ記事・画像自動生成ツール">
  <title>Articraft - ブログ記事 & 画像自動生成</title>
  <style>
    :root {
      /* Brand Colors */
      --brand-primary: #6366f1;
      --brand-secondary: #8b5cf6;
      --brand-accent: #ec4899;
      --brand-success: #10b981;
      --brand-warning: #f59e0b;

      /* Light Mode */
      --bg-primary: #fafbfc;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border-color: #e2e8f0;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);

      /* Spacing */
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;

      /* Border Radius */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      /* Transitions */
      --transition-fast: 150ms ease;
      --transition-normal: 250ms ease;
      --transition-slow: 350ms ease;
    }

    [data-theme="dark"] {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --border-color: #334155;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
      transition: background var(--transition-normal), color var(--transition-normal);
    }

    /* ===== Navigation ===== */
    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .nav-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: var(--space-4) var(--space-6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      text-decoration: none;
      color: var(--text-primary);
    }

    .nav-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 1.25rem;
    }

    .nav-title {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-stats {
      display: flex;
      align-items: center;
      gap: var(--space-6);
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    .stat-icon {
      font-size: 1rem;
    }

    .stat-value {
      font-weight: 600;
      color: var(--text-primary);
    }

    .streak-badge {
      background: linear-gradient(135deg, var(--brand-warning), #f97316);
      color: white;
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: none;
      background: var(--bg-tertiary);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.125rem;
      transition: all var(--transition-fast);
    }

    .icon-btn:hover {
      background: var(--border-color);
      color: var(--text-primary);
    }

    /* ===== Main Layout ===== */
    .main {
      max-width: 1400px;
      margin: 0 auto;
      padding: var(--space-6);
    }

    .layout {
      display: grid;
      gap: var(--space-6);
      grid-template-columns: 1fr;
    }

    @media (min-width: 1024px) {
      .layout {
        grid-template-columns: 420px 1fr;
      }
    }

    /* ===== Cards ===== */
    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      overflow: hidden;
      transition: box-shadow var(--transition-normal);
    }

    .card:hover {
      box-shadow: var(--shadow-lg);
    }

    .card-header {
      padding: var(--space-5) var(--space-6);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .card-title-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.875rem;
    }

    .card-body {
      padding: var(--space-6);
    }

    /* ===== Input Section ===== */
    .input-section {
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
    }

    .input-label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: var(--space-2);
      display: block;
    }

    .textarea-container {
      position: relative;
    }

    .main-textarea {
      width: 100%;
      min-height: 200px;
      padding: var(--space-4);
      border: 2px solid var(--border-color);
      border-radius: var(--radius-lg);
      background: var(--bg-tertiary);
      font-size: 1rem;
      font-family: inherit;
      line-height: 1.7;
      color: var(--text-primary);
      resize: vertical;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .main-textarea:focus {
      outline: none;
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }

    .main-textarea::placeholder {
      color: var(--text-muted);
    }

    .char-count {
      position: absolute;
      bottom: var(--space-3);
      right: var(--space-3);
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--bg-secondary);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-sm);
    }

    .prompt-suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
    }

    .suggestion-chip {
      padding: var(--space-2) var(--space-3);
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .suggestion-chip:hover {
      background: var(--brand-primary);
      border-color: var(--brand-primary);
      color: white;
    }

    /* ===== Generate Button ===== */
    .generate-btn {
      width: 100%;
      padding: var(--space-4) var(--space-6);
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
      border: none;
      border-radius: var(--radius-lg);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      transition: all var(--transition-normal);
      position: relative;
      overflow: hidden;
    }

    .generate-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--brand-secondary), var(--brand-accent));
      opacity: 0;
      transition: opacity var(--transition-normal);
    }

    .generate-btn:hover::before {
      opacity: 1;
    }

    .generate-btn span {
      position: relative;
      z-index: 1;
    }

    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .generate-btn:active {
      transform: translateY(0);
    }

    .generate-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* ===== Output Section ===== */
    .output-placeholder {
      text-align: center;
      padding: var(--space-8);
      color: var(--text-muted);
    }

    .placeholder-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto var(--space-4);
      background: var(--bg-tertiary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    .placeholder-title {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: var(--space-2);
    }

    .placeholder-desc {
      font-size: 0.875rem;
    }

    /* ===== Loading State ===== */
    .loading-state {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: var(--space-4);
      padding: var(--space-8);
    }

    .loading-state.active {
      display: flex;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border-color);
      border-top-color: var(--brand-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .loading-progress {
      width: 200px;
      height: 4px;
      background: var(--bg-tertiary);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .loading-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--brand-primary), var(--brand-secondary));
      width: 0%;
      animation: progress 2s ease-in-out infinite;
    }

    @keyframes progress {
      0% { width: 0%; }
      50% { width: 70%; }
      100% { width: 100%; }
    }

    /* ===== Article Output ===== */
    .article-output {
      display: none;
    }

    .article-output.visible {
      display: block;
    }

    .article-header {
      margin-bottom: var(--space-6);
      padding-bottom: var(--space-4);
      border-bottom: 2px solid var(--brand-primary);
    }

    .article-title {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text-primary);
    }

    .article-meta {
      display: flex;
      gap: var(--space-4);
      margin-top: var(--space-3);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .article-content {
      font-size: 1rem;
      line-height: 1.9;
      color: var(--text-secondary);
    }

    .article-content h2 {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--text-primary);
      margin: var(--space-6) 0 var(--space-3);
      padding-left: var(--space-4);
      border-left: 3px solid var(--brand-primary);
    }

    .article-content strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .article-actions {
      display: flex;
      gap: var(--space-3);
      margin-top: var(--space-6);
      padding-top: var(--space-4);
      border-top: 1px solid var(--border-color);
    }

    .action-btn {
      flex: 1;
      padding: var(--space-3) var(--space-4);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      transition: all var(--transition-fast);
    }

    .action-btn:hover {
      background: var(--brand-primary);
      border-color: var(--brand-primary);
      color: white;
    }

    /* ===== Image Section ===== */
    .image-section {
      display: none;
      margin-top: var(--space-6);
    }

    .image-section.visible {
      display: block;
    }

    .image-tabs {
      display: flex;
      background: var(--bg-tertiary);
      padding: var(--space-1);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-4);
    }

    .image-tab {
      flex: 1;
      padding: var(--space-3);
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .image-tab.active {
      background: var(--bg-secondary);
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }

    .canvas-container {
      background: repeating-conic-gradient(var(--bg-tertiary) 0% 25%, var(--bg-secondary) 0% 50%) 50% / 16px 16px;
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      display: flex;
      justify-content: center;
    }

    .canvas-container canvas {
      max-width: 100%;
      height: auto;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
    }

    .image-controls {
      margin-top: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: var(--space-4);
    }

    .control-label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      min-width: 60px;
    }

    .style-options {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    .style-option {
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .style-option:hover {
      border-color: var(--brand-primary);
    }

    .style-option.active {
      background: var(--brand-primary);
      border-color: var(--brand-primary);
      color: white;
    }

    .color-options {
      display: flex;
      gap: var(--space-2);
    }

    .color-option {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .color-option:hover {
      transform: scale(1.1);
    }

    .color-option.active {
      border-color: var(--text-primary);
    }

    /* ===== History Section ===== */
    .history-section {
      margin-top: var(--space-6);
    }

    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: var(--space-3);
    }

    .history-item {
      position: relative;
      aspect-ratio: 16/9;
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--border-color);
      transition: all var(--transition-fast);
    }

    .history-item:hover {
      border-color: var(--brand-primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .history-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .history-item-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      opacity: 0;
      transition: opacity var(--transition-fast);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: var(--space-3);
    }

    .history-item:hover .history-item-overlay {
      opacity: 1;
    }

    .history-item-title {
      font-size: 0.75rem;
      color: white;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item-date {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.7);
    }

    .history-item-delete {
      position: absolute;
      top: var(--space-2);
      right: var(--space-2);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(0,0,0,0.5);
      border: none;
      color: white;
      font-size: 0.75rem;
      cursor: pointer;
      opacity: 0;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .history-item:hover .history-item-delete {
      opacity: 1;
    }

    .history-item-delete:hover {
      background: #ef4444;
    }

    .empty-history {
      text-align: center;
      padding: var(--space-8);
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    /* ===== Features Section ===== */
    .features-grid {
      display: grid;
      gap: var(--space-3);
    }

    .feature-card {
      padding: var(--space-4);
      background: var(--bg-tertiary);
      border-radius: var(--radius-lg);
      display: flex;
      gap: var(--space-4);
      transition: all var(--transition-fast);
    }

    .feature-card:hover {
      background: var(--border-color);
    }

    .feature-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }

    .feature-content {
      flex: 1;
    }

    .feature-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: var(--space-1);
    }

    .feature-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* ===== Toast ===== */
    .toast {
      position: fixed;
      bottom: var(--space-6);
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      padding: var(--space-4) var(--space-6);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      display: flex;
      align-items: center;
      gap: var(--space-3);
      opacity: 0;
      transition: all var(--transition-normal);
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-icon {
      width: 24px;
      height: 24px;
      background: var(--brand-success);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.75rem;
    }

    .toast-message {
      font-size: 0.9rem;
      font-weight: 500;
    }

    /* ===== Modal ===== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.9);
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      max-width: 90vw;
      max-height: 90vh;
    }

    .modal-content img {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: var(--radius-md);
    }

    .modal-close {
      position: absolute;
      top: var(--space-4);
      right: var(--space-4);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition-fast);
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .nav-stats {
        display: none;
      }

      .main {
        padding: var(--space-4);
      }

      .card-body {
        padding: var(--space-4);
      }
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-content">
      <a href="#" class="nav-brand">
        <div class="nav-logo">A</div>
        <span class="nav-title">Articraft</span>
      </a>

      <div class="nav-stats">
        <div class="stat-item">

  <script>
    // ===== State Management =====
    const state = {
      generatedArticle: { title: '', content: '', keywords: [] },
      currentImageTab: 'thumbnail',
      currentStyle: 'gradient',
      currentColors: ['#6366f1', '#8b5cf6'],
      history: JSON.parse(localStorage.getItem('articraft_history') || '[]'),
      stats: JSON.parse(localStorage.getItem('articraft_stats') || '{"totalGenerated": 0, "lastGeneratedDate": null, "streak": 0}'),
      theme: localStorage.getItem('articraft_theme') || 'light'
    };

    // ===== DOM Elements =====
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    const elements = {
      inputText: $('#inputText'),
      charCount: $('#charCount'),
      generateBtn: $('#generateBtn'),
      outputPlaceholder: $('#outputPlaceholder'),
      loadingState: $('#loadingState'),
      articleOutput: $('#articleOutput'),
      articleTitle: $('#articleTitle'),
      articleContent: $('#articleContent'),
      articleDate: $('#articleDate'),
      articleWordCount: $('#articleWordCount'),
      imageSection: $('#imageSection'),
      canvas: $('#imageCanvas'),
      historySection: $('#historySection'),
      historyGrid: $('#historyGrid'),
      toast: $('#toast'),
      toastMessage: $('#toastMessage'),
      totalGenerated: $('#totalGenerated'),
      streakBadge: $('#streakBadge'),
      streakDays: $('#streakDays'),
      themeToggle: $('#themeToggle'),
      historyBtn: $('#historyBtn'),
      modal: $('#modal'),
      modalImage: $('#modalImage'),
      modalClose: $('#modalClose')
    };

    const ctx = elements.canvas.getContext('2d');

    // ===== Initialize =====
    function init() {
      applyTheme();
      updateStats();
      setupEventListeners();
      renderHistory();
    }

    function applyTheme() {
      document.body.setAttribute('data-theme', state.theme);
      elements.themeToggle.textContent = state.theme === 'dark' ? '☀️' : '🌙';
    }

    function updateStats() {
      elements.totalGenerated.textContent = state.stats.totalGenerated;

      // Check streak
      const today = new Date().toDateString();
      const lastDate = state.stats.lastGeneratedDate;

      if (lastDate) {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);

        if (lastDate === today) {
          // Same day, streak continues
        } else if (lastDate === yesterday.toDateString()) {
          // Yesterday, streak continues
        } else {
          // Streak broken
          state.stats.streak = 0;
        }
      }

      if (state.stats.streak > 0) {
        elements.streakBadge.style.display = 'flex';
        elements.streakDays.textContent = state.stats.streak;
      }
    }

    // ===== Event Listeners =====
    function setupEventListeners() {
      // Character count
      elements.inputText.addEventListener('input', () => {
        elements.charCount.textContent = elements.inputText.value.length;
      });

      // Generate button
      elements.generateBtn.addEventListener('click', generateAll);

      // Suggestion chips
      $$('.suggestion-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const currentText = elements.inputText.value.trim();
          const newText = chip.dataset.text;
          elements.inputText.value = currentText ? `${currentText}\n・${newText}` : `・${newText}`;
          elements.charCount.textContent = elements.inputText.value.length;
        });
      });

      // Image tabs
      $$('.image-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          $$('.image-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          state.currentImageTab = tab.dataset.tab;
          elements.canvas.width = state.currentImageTab === 'thumbnail' ? 1200 : 1200;
          elements.canvas.height = state.currentImageTab === 'thumbnail' ? 630 : 800;
          generateImage();
        });
      });

      // Style options
      $$('.style-option').forEach(opt => {
        opt.addEventListener('click', () => {
          $$('.style-option').forEach(o => o.classList.remove('active'));
          opt.classList.add('active');
          state.currentStyle = opt.dataset.style;
          generateImage();
        });
      });

      // Color options
      $$('.color-option').forEach(opt => {
        opt.addEventListener('click', () => {
          $$('.color-option').forEach(o => o.classList.remove('active'));
          opt.classList.add('active');
          state.currentColors = opt.dataset.colors.split(',');
          generateImage();
        });
      });

      // Theme toggle
      elements.themeToggle.addEventListener('click', () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        localStorage.setItem('articraft_theme', state.theme);
        applyTheme();
      });

      // History toggle
      elements.historyBtn.addEventListener('click', () => {
        const isVisible = elements.historySection.style.display !== 'none';
        elements.historySection.style.display = isVisible ? 'none' : 'block';
      });

      // Modal
      elements.modalClose.addEventListener('click', () => {
        elements.modal.classList.remove('active');
      });
      elements.modal.addEventListener('click', (e) => {
        if (e.target === elements.modal) {
          elements.modal.classList.remove('active');
        }
      });
    }

    // ===== Generation Logic =====
    async function generateAll() {
      const text = elements.inputText.value.trim();
      if (!text) {
        showToast('イイタイコトを入力してください', 'warning');
        return;
      }

      elements.generateBtn.disabled = true;
      elements.outputPlaceholder.style.display = 'none';
      elements.loadingState.classList.add('active');
      elements.articleOutput.classList.remove('visible');
      elements.imageSection.classList.remove('visible');

      await new Promise(resolve => setTimeout(resolve, 2000));

      state.generatedArticle = generateArticleFromInput(text);

      // Update UI
      elements.articleTitle.textContent = state.generatedArticle.title;
      elements.articleContent.innerHTML = formatArticleContent(state.generatedArticle.content);
      elements.articleDate.textContent = new Date().toLocaleDateString('ja-JP');
      elements.articleWordCount.textContent = state.generatedArticle.content.length;

      elements.loadingState.classList.remove('active');
      elements.articleOutput.classList.add('visible');
      elements.imageSection.classList.add('visible');

      generateImage();
      elements.generateBtn.disabled = false;

      // Update stats
      updateGenerationStats();

      showToast('記事と画像を生成しました');
    }

    function updateGenerationStats() {
      const today = new Date().toDateString();

      if (state.stats.lastGeneratedDate !== today) {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);

        if (state.stats.lastGeneratedDate === yesterday.toDateString()) {
          state.stats.streak++;
        } else {
          state.stats.streak = 1;
        }
        state.stats.lastGeneratedDate = today;
      }

      state.stats.totalGenerated++;
      localStorage.setItem('articraft_stats', JSON.stringify(state.stats));
      updateStats();
    }

    function generateArticleFromInput(input) {
      const keywords = extractKeywords(input);

      const titleTemplates = [
        `${keywords[0] || '悩み'}から解放される方法`,
        `${keywords[0] || '日常'}を変える小さな習慣`,
        `【保存版】${keywords[0] || '心'}が軽くなる考え方`,
        `${keywords[0] || 'ストレス'}に疲れたあなたへ贈る言葉`,
        `もう${keywords[0] || '悩み'}で悩まない！自分らしく生きるコツ`
      ];
      const title = titleTemplates[Math.floor(Math.random() * titleTemplates.length)];

      const intro = generateIntro(input, keywords);
      const body = generateBody(input, keywords);
      const conclusion = generateConclusion(keywords);

      const content = `${intro}\n\n## なぜ${keywords[0] || 'このこと'}で悩むのか\n\n${body}\n\n## 明日からできる小さな一歩\n\n${conclusion}`;

      return { title, content, keywords };
    }

    function extractKeywords(text) {
      const commonWords = ['完璧主義', 'SNS', '疲れ', '落ち込む', '気楽', '不安', 'ストレス', '比較', '自分', '生きる', '幸せ', '人生', '仕事', '人間関係', '自信'];
      const found = commonWords.filter(word => text.includes(word));

      if (found.length === 0) {
        const lines = text.split('\n').filter(l => l.trim());
        if (lines.length > 0) {
          const firstLine = lines[0].replace(/^[・\-\*]\s*/, '');
          return [firstLine.substring(0, 10)];
        }
        return ['日常の悩み'];
      }
      return found;
    }

    function generateIntro(input, keywords) {
      const intros = [
        `最近、${keywords[0] || '何か'}に疲れていませんか？\n\n実は、多くの人が同じような悩みを抱えています。でも大丈夫。この記事を読み終わる頃には、きっと心が少し軽くなっているはずです。`,
        `「${keywords[0] || 'このままでいいのかな'}...」\n\nそんな風に感じているあなた、まずは深呼吸してみてください。あなたは決して一人じゃありません。`,
        `こんにちは。今日は${keywords[0] || '日々の悩み'}について、一緒に考えてみませんか？\n\n完璧じゃなくていい。そのままのあなたで大丈夫なんです。`
      ];
      return intros[Math.floor(Math.random() * intros.length)];
    }

    function generateBody(input, keywords) {
      let body = '';

      if (keywords.includes('完璧主義')) {
        body += `完璧を求めることは、決して悪いことではありません。でも、それが自分を苦しめているなら、少し立ち止まってみましょう。\n\n「80点でOK」という考え方を試してみてください。意外と、それでも周りは認めてくれるものです。\n\n`;
      }

      if (keywords.includes('SNS') || input.includes('キラキラ')) {
        body += `SNSで見かける「キラキラした投稿」は、その人の人生のほんの一部。誰だって見せたくない部分はあります。\n\n比較するなら、昨日の自分と今日の自分。小さな成長を見つけてみませんか？\n\n`;
      }

      if (keywords.includes('疲れ') || keywords.includes('ストレス')) {
        body += `心が疲れているときは、無理に頑張らなくていいんです。\n\n好きな音楽を聴いたり、温かい飲み物を飲んだり。小さな「心地よさ」を大切にしてみてください。\n\n`;
      }

      if (keywords.includes('自信')) {
        body += `自信がないと感じるのは、あなたが真剣に物事と向き合っている証拠です。\n\n小さな成功体験を積み重ねることで、自信は少しずつ育っていきます。\n\n`;
      }

      if (keywords.includes('人間関係')) {
        body += `人間関係の悩みは、誰もが抱えるもの。大切なのは、すべての人に好かれようとしないこと。\n\n自分を大切にしてくれる人との関係を育てていきましょう。\n\n`;
      }

      if (body === '') {
        body = `あなたが感じていること、それは自然な感情です。\n\n大切なのは、その感情を否定せずに受け入れること。「今、こう感じているんだな」と、優しく自分に声をかけてあげてください。\n\n`;
      }

      return body;
    }

    function generateConclusion(keywords) {
      const conclusions = [
        `最後に、ひとつだけ覚えておいてほしいことがあります。\n\n**あなたは、そのままで十分素敵です。**\n\n完璧じゃなくていい。失敗してもいい。それでも前に進もうとしている、その姿勢がすでに素晴らしいんです。\n\n明日から、ほんの少しだけ自分に優しくしてみませんか？`,
        `変わりたいと思ったその瞬間から、あなたはもう変わり始めています。\n\n焦らなくて大丈夫。一歩ずつ、自分のペースで進んでいきましょう。\n\n**今日も一日、お疲れさまでした。**`,
        `この記事が、あなたの心に少しでも届いていたら嬉しいです。\n\n辛いときは辛いと言っていい。休みたいときは休んでいい。\n\n**あなたの幸せを、心から応援しています。**`
      ];
      return conclusions[Math.floor(Math.random() * conclusions.length)];
    }

    function formatArticleContent(content) {
      return content
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/## (.*)/g, '<h2>$1</h2>')
        .replace(/\n/g, '<br>');
    }

    // ===== Image Generation =====
    function generateImage() {
      if (state.currentImageTab === 'thumbnail') {
        generateThumbnail();
      } else {
        generateSupplement();
      }
    }

    function generateThumbnail() {
      ctx.clearRect(0, 0, elements.canvas.width, elements.canvas.height);
      drawBackground();

      const title = state.generatedArticle.title || 'タイトルが入ります';

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 52px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
      ctx.shadowBlur = 20;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 4;

      const lines = wrapText(title, elements.canvas.width - 160, 52);
      const lineHeight = 68;
      const startY = elements.canvas.height / 2 - (lines.length - 1) * lineHeight / 2;

      lines.forEach((line, i) => {
        ctx.fillText(line, elements.canvas.width / 2, startY + i * lineHeight);
      });

      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;

      // Brand watermark
      ctx.font = '500 18px -apple-system, sans-serif';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.textAlign = 'right';
      ctx.fillText('Articraft', elements.canvas.width - 40, elements.canvas.height - 30);
    }

    function generateSupplement() {
      ctx.clearRect(0, 0, elements.canvas.width, elements.canvas.height);
      drawBackground();

      const cardX = 60;
      const cardY = 60;
      const cardWidth = elements.canvas.width - 120;
      const cardHeight = elements.canvas.height - 120;

      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      roundRect(ctx, cardX, cardY, cardWidth, cardHeight, 20);

      ctx.fillStyle = state.currentColors[0];
      ctx.font = 'bold 40px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText('📌 記事のポイント', cardX + 50, cardY + 45);

      const gradient = ctx.createLinearGradient(cardX + 50, 0, cardX + 200, 0);
      gradient.addColorStop(0, state.currentColors[0]);
      gradient.addColorStop(1, state.currentColors[1]);
      ctx.fillStyle = gradient;
      ctx.fillRect(cardX + 50, cardY + 105, 100, 4);

      const keywords = state.generatedArticle.keywords.length > 0
        ? state.generatedArticle.keywords
        : ['ポイント1', 'ポイント2', 'ポイント3'];

      const points = [
        { emoji: '💡', text: `${keywords[0] || '心を軽くする'}考え方` },
        { emoji: '🎯', text: '無理しない生き方のコツ' },
        { emoji: '✨', text: '明日から始められる習慣' }
      ];

      points.forEach((point, i) => {
        const y = cardY + 160 + i * 110;

        ctx.fillStyle = state.currentColors[0] + '12';
        roundRect(ctx, cardX + 50, y, cardWidth - 100, 85, 14);

        ctx.font = '44px sans-serif';
        ctx.fillText(point.emoji, cardX + 75, y + 18);

        ctx.fillStyle = '#1e293b';
        ctx.font = '500 26px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif';
        ctx.fillText(point.text, cardX + 140, y + 32);
      });

      // Keywords at bottom
      ctx.font = '500 20px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif';
      let keywordX = cardX + 50;
      const keywordY = cardY + cardHeight - 70;

      keywords.slice(0, 4).forEach(keyword => {
        const width = ctx.measureText(keyword).width + 28;

        ctx.fillStyle = state.currentColors[0] + '18';
        roundRect(ctx, keywordX, keywordY, width, 36, 18);

        ctx.fillStyle = state.currentColors[0];
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(keyword, keywordX + width / 2, keywordY + 18);

        keywordX += width + 10;
        ctx.textAlign = 'left';
      });
    }

    function drawBackground() {
      const { width, height } = elements.canvas;

      switch (state.currentStyle) {
        case 'gradient':
          const gradient = ctx.createLinearGradient(0, 0, width, height);
          gradient.addColorStop(0, state.currentColors[0]);
          gradient.addColorStop(1, state.currentColors[1]);
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, width, height);

          ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
          for (let i = 0; i < 12; i++) {
            const x = Math.random() * width;
            const y = Math.random() * height;
            const r = 60 + Math.random() * 120;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
          }
          break;

        case 'geometric':
          const geoGradient = ctx.createLinearGradient(0, 0, width, height);
          geoGradient.addColorStop(0, state.currentColors[0]);
          geoGradient.addColorStop(1, state.currentColors[1]);
          ctx.fillStyle = geoGradient;
          ctx.fillRect(0, 0, width, height);

          ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
          for (let i = 0; i < 15; i++) {
            const x = Math.random() * width;
            const y = Math.random() * height;
            const size = 40 + Math.random() * 80;
            ctx.beginPath();
            ctx.moveTo(x, y - size);
            ctx.lineTo(x + size, y + size);
            ctx.lineTo(x - size, y + size);
            ctx.closePath();
            ctx.fill();
          }
          break;

        case 'wave':
          const waveGradient = ctx.createLinearGradient(0, 0, width, height);
          waveGradient.addColorStop(0, state.currentColors[0]);
          waveGradient.addColorStop(1, state.currentColors[1]);
          ctx.fillStyle = waveGradient;
          ctx.fillRect(0, 0, width, height);

          for (let w = 0; w < 4; w++) {
            ctx.fillStyle = `rgba(255, 255, 255, ${0.025 + w * 0.015})`;
            ctx.beginPath();
            ctx.moveTo(0, height);
            for (let x = 0; x <= width; x += 8) {
              const y = height - 70 - w * 50 + Math.sin(x * 0.007 + w * 0.8) * 35;
              ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fill();
          }
          break;

        case 'minimal':
          ctx.fillStyle = state.currentColors[0];
          ctx.fillRect(0, 0, width, height);

          ctx.fillStyle = state.currentColors[1];
          ctx.beginPath();
          ctx.arc(width - 80, height - 80, 180, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(50, 50);
          ctx.lineTo(50, 150);
          ctx.stroke();
          break;
      }
    }

    function wrapText(text, maxWidth, fontSize) {
      ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif`;
      const chars = text.split('');
      const lines = [];
      let currentLine = '';

      chars.forEach(char => {
        const testLine = currentLine + char;
        if (ctx.measureText(testLine).width > maxWidth && currentLine) {
          lines.push(currentLine);
          currentLine = char;
        } else {
          currentLine = testLine;
        }
      });
      if (currentLine) lines.push(currentLine);
      return lines;
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      ctx.fill();
    }

    // ===== Actions =====
    function copyArticle() {
      const text = `${state.generatedArticle.title}\n\n${state.generatedArticle.content}`;
      navigator.clipboard.writeText(text).then(() => {
        showToast('記事をコピーしました');
      });
    }

    function regenerate() {
      generateAll();
    }

    function saveToHistory() {
      const dataUrl = elements.canvas.toDataURL('image/png');
      const item = {
        id: crypto.randomUUID(),
        title: state.generatedArticle.title,
        content: state.generatedArticle.content,
        thumbnailUrl: dataUrl,
        createdAt: new Date().toISOString()
      };

      state.history.unshift(item);
      if (state.history.length > 30) {
        state.history = state.history.slice(0, 30);
      }

      localStorage.setItem('articraft_history', JSON.stringify(state.history));
      renderHistory();
      showToast('履歴に保存しました');
    }

    function downloadImage() {
      const link = document.createElement('a');
      const type = state.currentImageTab === 'thumbnail' ? 'thumbnail' : 'supplement';
      link.download = `articraft-${type}-${Date.now()}.png`;
      link.href = elements.canvas.toDataURL('image/png');
      link.click();
      showToast('画像をダウンロードしました');
    }

    async function copyImage() {
      try {
        const blob = await new Promise(resolve => elements.canvas.toBlob(resolve, 'image/png'));
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        showToast('画像をコピーしました');
      } catch (err) {
        showToast('コピーに失敗しました', 'error');
      }
    }

    function renderHistory() {
      if (state.history.length === 0) {
        elements.historyGrid.innerHTML = '<div class="empty-history">履歴がありません</div>';
        return;
      }

      elements.historyGrid.innerHTML = state.history.map(item => `
        <div class="history-item" data-id="${item.id}">
          <img src="${item.thumbnailUrl}" alt="${item.title}">
          <div class="history-item-overlay">
            <div class="history-item-title">${item.title}</div>
            <div class="history-item-date">${new Date(item.createdAt).toLocaleDateString('ja-JP')}</div>
          </div>
          <button class="history-item-delete" onclick="deleteHistoryItem('${item.id}')">×</button>
        </div>
      `).join('');

      $$('.history-item img').forEach(img => {
        img.addEventListener('click', () => {
          elements.modalImage.src = img.src;
          elements.modal.classList.add('active');
        });
      });
    }

    function deleteHistoryItem(id) {
      state.history = state.history.filter(item => item.id !== id);
      localStorage.setItem('articraft_history', JSON.stringify(state.history));
      renderHistory();
      showToast('履歴を削除しました');
    }

    function clearHistory() {
      if (!confirm('すべての履歴を削除しますか？')) return;
      state.history = [];
      localStorage.setItem('articraft_history', JSON.stringify(state.history));
      renderHistory();
      showToast('すべての履歴を削除しました');
    }

    function showToast(message, type = 'success') {
      elements.toastMessage.textContent = message;
      elements.toast.classList.add('show');
      setTimeout(() => elements.toast.classList.remove('show'), 2500);
    }

    // Initialize
    init();
  </script>
</body>
</html>
